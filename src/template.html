<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="{{name}}" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="{{url}}" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4e79'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EAL%3C/text%3E%3C/svg%3E" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}" />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">{{jsonLd}}</script>
    <style>
{{styles}}
    </style>
  </head>
  <body>
    <nav class="toolbar" aria-label="Résumé actions">
      <button class="button" type="button" onclick="window.print()">Print / Save as PDF</button>
    </nav>
    <div class="page">
{{content}}
    </div>
    <footer class="footer">
      <p>© {{year}} {{name}} · Generated from <a href="https://github.com/erocrizs/resume">resume.md</a></p>
    </footer>
{{inject}}
  </body>
</html>
